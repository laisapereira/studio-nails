server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
                proxy_pass          https://studio-api-production-8345.up.railway.app/api/;
                proxy_ssl_server_name on;
                proxy_http_version  1.1;
                proxy_set_header    Host                studio-api-production-8345.up.railway.app;
                proxy_ssl_name studio-api-production-8345.up.railway.app;
                proxy_set_header    X-Real-IP           $remote_addr;
                proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
                proxy_read_timeout  30s;
    }

        location / {
                try_files $uri $uri/ /index.html;
    }
}
